<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HobbyLog — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f3;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 12px; width: 400px; overflow: hidden;
            border: 1px solid #eee; }
    .tabs { display: flex; border-bottom: 1px solid #eee; }
    .tab { flex: 1; padding: 14px; border: none; background: none; cursor: pointer;
           font-size: 14px; font-weight: 500; color: #888; border-bottom: 2px solid transparent; }
    .tab.active { color: #1D9E75; border-bottom-color: #1D9E75; }
    .body { padding: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #666;
            text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #1D9E75; }
    .btn { width: 100%; padding: 11px; background: #1D9E75; color: white; border: none;
           border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #msg { margin-top: 12px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="show('login')">Sign In</button>
    <button class="tab" onclick="show('signup')">Sign Up</button>
  </div>
  <div class="body">
    <div id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" />
      <button class="btn" onclick="login()">Sign In →</button>
    </div>
    <div id="signupForm" style="display:none">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Ada Lovelace" />
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="signupPass" placeholder="Min. 8 characters" />
      <button class="btn" onclick="signup()">Create Account →</button>
    </div>
    <p id="msg"></p>
  </div>
</div>
<script>
  const API = 'http://localhost:3000/api';
  const msg = document.getElementById('msg');

  function show(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? '' : 'none';
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (i === 0) === (tab === 'login')));
  }

  async function login() {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: loginEmail.value, password: loginPass.value })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';  // ← redirect
    } else {
      msg.style.color = 'red'; msg.textContent = data.error;
    }
  }

  async function signup() {
    const res = await fetch(`${API}/auth/signup`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: signupName.value, email: signupEmail.value, password: signupPass.value })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';  // ← redirect
    } else {
      msg.style.color = 'red'; msg.textContent = data.error;
    }
  }
</script>
</body>
</html>
